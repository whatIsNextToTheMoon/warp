name: Build Warp OSS AppImage

on:
  workflow_dispatch:
  push:
    # This repo's default branch is `build-appimage`, so include it here; otherwise
    # GitHub Actions won't register/show this workflow until it has a run.
    branches: [build-appimage, main, master]

jobs:
  appimage:
    runs-on: ubuntu-22.04
    env:
      CARGO_TERM_COLOR: always
      # Warp bundling scripts read these.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_LICENSES: "1"
      SKIP_SETTINGS_SCHEMA: "1"

      # Reduce peak RAM usage:
      # - OSS bundling uses the `release-lto` profile (ThinLTO).
      # - Cargo env overrides for custom profiles can be version-sensitive and have
      #   caused config parsing failures on GitHub runners.
      # Use RUSTFLAGS instead: it appends rustc flags after profile defaults,
      # effectively overriding them (e.g. `-C lto=off`).
      RUSTFLAGS: "-C lto=off -C debuginfo=0"

      # Enable sccache to speed up rebuilds (especially when iterating on i18n).
      SCCACHE_CACHE_SIZE: "5G"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          ./script/linux/install_build_deps

      - name: Install linuxdeploy (for AppImage bundling)
        run: |
          ./script/linux/install_linuxdeploy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Make the cache key stable across workflow runs to avoid creating a new
          # cache entry per job/run (which reduces cache hit rate and burns the 10GB budget).
          shared-key: build-appimage
          add-job-id-key: false
          # By default rust-cache avoids caching workspace crates; for Warp this
          # means expensive workspace crates (e.g. `onboarding`, `ai`, etc.) get
          # rebuilt every run even when unchanged. Opt-in to cache them.
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          # Must be an absolute, always-writable directory; sccache can be
          # invoked from build scripts with various working directories
          # (including read-only cargo registry dirs), so a relative path will
          # fail with EACCES.
          path: ${{ runner.temp }}/sccache
          key: ${{ runner.os }}-sccache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-

      - name: Compute release tag (for packaging)
        id: rel
        run: |
          # Generate a deterministic "release tag" string for this workflow run.
          #
          # We reuse the same format used by Warp's release tooling
          # (v0.<date>.<channel>_NN), but we don't need a real tag object here —
          # only a stable string for package version metadata and Arch pkgver.
          #
          # NOTE: Avoid '-' characters (Arch pkgver lint) and keep it short.
          echo "tag=v0.0.0.oss_$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build AppImage (OSS)
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          GIT_RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          mkdir -p "$SCCACHE_DIR"
          ./script/linux/bundle -c oss --packages appimage --release-tag "$GIT_RELEASE_TAG"

      - name: Bundle Arch Linux package (OSS)
        uses: ./.github/actions/bundle_arch_package
        with:
          channel: oss
          release-tag: ${{ steps.rel.outputs.tag }}
          arch: x86_64

      - name: sccache stats
        if: always()
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: |
          sccache --show-stats || true

      - name: Compute checksums
        run: |
          cd target/release-lto/bundle/linux
          # Don't write a checksum file name containing '*' (upload-artifact
          # rejects it for cross-platform filesystem compatibility).
          sha256sum WarpOss-*.AppImage | tee SHA256SUMS
          sha256sum *.pkg.tar.zst | tee SHA256SUMS.arch

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: WarpOss-Artifacts
          path: |
            target/release-lto/bundle/linux/WarpOss-*.AppImage
            target/release-lto/bundle/linux/SHA256SUMS
            target/release-lto/bundle/linux/*.pkg.tar.zst
            target/release-lto/bundle/linux/SHA256SUMS.arch
