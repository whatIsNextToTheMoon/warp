name: Build Warp OSS AppImage

on:
  workflow_dispatch:
  push:
    # This repo's default branch is `build-appimage`, so include it here; otherwise
    # GitHub Actions won't register/show this workflow until it has a run.
    branches: [build-appimage, main, master]

permissions:
  # Needed to create/delete Releases and tags (we publish build artifacts as
  # GitHub Release assets and prune old releases).
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    env:
      CARGO_TERM_COLOR: always
      # Warp bundling scripts read these.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_LICENSES: "1"
      SKIP_SETTINGS_SCHEMA: "1"

      # Reduce peak RAM usage:
      # - OSS bundling uses the `release-lto` profile (ThinLTO).
      # - Cargo env overrides for custom profiles can be version-sensitive and have
      #   caused config parsing failures on GitHub runners.
      # Use RUSTFLAGS instead: it appends rustc flags after profile defaults,
      # effectively overriding them (e.g. `-C lto=off`).
      RUSTFLAGS: "-C lto=off -C debuginfo=0"

      # Enable sccache to speed up rebuilds (especially when iterating on i18n).
      SCCACHE_CACHE_SIZE: "5G"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          ./script/linux/install_build_deps

      - name: Install linuxdeploy (for AppImage bundling)
        run: |
          ./script/linux/install_linuxdeploy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Make the cache key stable across workflow runs to avoid creating a new
          # cache entry per job/run (which reduces cache hit rate and burns the 10GB budget).
          shared-key: build-appimage
          add-job-id-key: false
          # By default rust-cache avoids caching workspace crates; for Warp this
          # means expensive workspace crates (e.g. `onboarding`, `ai`, etc.) get
          # rebuilt every run even when unchanged. Opt-in to cache them.
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          # Must be an absolute, always-writable directory; sccache can be
          # invoked from build scripts with various working directories
          # (including read-only cargo registry dirs), so a relative path will
          # fail with EACCES.
          path: ${{ runner.temp }}/sccache
          key: ${{ runner.os }}-sccache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-

      - name: Compute release tag (for packaging)
        id: rel
        run: |
          # Generate a deterministic "release tag" string for this workflow run.
          #
          # We reuse the same format used by Warp's release tooling
          # (v0.<date>.<channel>_NN), but we don't need a real tag object here —
          # only a stable string for package version metadata and Arch pkgver.
          #
          # NOTE: Avoid '-' characters (Arch pkgver lint) and keep it short.
          echo "tag=v0.0.0.oss_$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build AppImage (OSS)
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          GIT_RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          mkdir -p "$SCCACHE_DIR"
          ./script/linux/bundle -c oss --packages appimage --release-tag "$GIT_RELEASE_TAG"

      - name: Bundle Arch Linux package (OSS)
        uses: ./.github/actions/bundle_arch_package
        with:
          channel: oss
          release-tag: ${{ steps.rel.outputs.tag }}
          arch: x86_64

      - name: sccache stats
        if: always()
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
        run: |
          sccache --show-stats || true

      - name: Compute checksums
        run: |
          cd target/release-lto/bundle/linux
          # Don't write a checksum file name containing '*' (upload-artifact
          # rejects it for cross-platform filesystem compatibility).
          sha256sum WarpOss-*.AppImage | tee SHA256SUMS
          sha256sum *.pkg.tar.zst | tee SHA256SUMS.arch

      - name: Publish GitHub Release (OSS)
        # Upload artifacts as Release assets so downloads are typically faster
        # and more reliable than the Actions UI. Keep only the latest 3 OSS
        # releases to avoid clutter.
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564 # v2.0.2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            target/release-lto/bundle/linux/WarpOss-*.AppImage
            target/release-lto/bundle/linux/SHA256SUMS
            target/release-lto/bundle/linux/*.pkg.tar.zst
            target/release-lto/bundle/linux/SHA256SUMS.arch

      - name: Prune old OSS releases (keep latest 3)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const KEEP = 3;
            const TAG_PREFIX = 'v0.0.0.oss_';

            // Fetch releases (paged) and filter to our OSS-tagged releases.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            const oss = releases
              .filter(r => typeof r.tag_name === 'string' && r.tag_name.startsWith(TAG_PREFIX))
              // Newest first
              .sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime());

            if (oss.length <= KEEP) {
              console.log(`OSS releases: ${oss.length} (<= ${KEEP}); nothing to prune.`);
              return;
            }

            const toDelete = oss.slice(KEEP);
            console.log(`Pruning ${toDelete.length} old OSS release(s); keeping latest ${KEEP}.`);

            for (const r of toDelete) {
              console.log(`Deleting release id=${r.id} tag=${r.tag_name} created_at=${r.created_at}`);
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: r.id,
              });

              // Best effort: delete the associated tag ref as well. If it was
              // already removed (or protected), ignore errors.
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `tags/${r.tag_name}`,
                });
                console.log(`Deleted tag ref tags/${r.tag_name}`);
              } catch (e) {
                console.log(`Could not delete tag ref tags/${r.tag_name}: ${e?.message ?? e}`);
              }
            }

      # NOTE: We intentionally do NOT upload GitHub Actions artifacts here.
      # We publish build outputs as GitHub Release assets instead, to reduce
      # Actions artifact storage/retention and to make downloads more reliable.
